name: Release Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        run: npm run build:desktop

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 1

  publish-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release_assets

          # Windows (.msi preferred, .exe NSIS fallback)
          msi=$(find artifacts/windows-build -name '*.msi' | head -1)
          if [ -n "$msi" ]; then
            cp "$msi" release_assets/ppc-bench-${{ github.ref_name }}-windows.msi
          else
            exe=$(find artifacts/windows-build -name '*.exe' | head -1)
            [ -n "$exe" ] && cp "$exe" release_assets/ppc-bench-${{ github.ref_name }}-windows-setup.exe
          fi

          # macOS (.dmg)
          dmg=$(find artifacts/macos-build -name '*.dmg' | head -1)
          [ -n "$dmg" ] && cp "$dmg" release_assets/ppc-bench-${{ github.ref_name }}-macos.dmg

          # Linux (.AppImage and .deb)
          appimage=$(find artifacts/linux-build -name '*.AppImage' | head -1)
          [ -n "$appimage" ] && cp "$appimage" release_assets/ppc-bench-${{ github.ref_name }}-linux.AppImage

          deb=$(find artifacts/linux-build -name '*.deb' | head -1)
          [ -n "$deb" ] && cp "$deb" release_assets/ppc-bench-${{ github.ref_name }}-linux.deb

          ls -la release_assets/

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          artifacts: "release_assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}
