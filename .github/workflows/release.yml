name: Release Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        run: npm run build:desktop

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            apps/desktop/src-tauri/target/release/*.msi
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 1

  publish-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release_assets

          # Windows
          if [ -f "artifacts/windows-build/"*.msi ]; then
            cp artifacts/windows-build/*.msi release_assets/ppc-bench-${{ github.ref_name }}-windows.msi
          fi

          # macOS
          if [ -f "artifacts/macos-build/"*.dmg ]; then
            cp artifacts/macos-build/*.dmg release_assets/ppc-bench-${{ github.ref_name }}-macos.dmg
          elif [ -d "artifacts/macos-build/"*.app ]; then
            cp -r artifacts/macos-build/*.app release_assets/
          fi

          # Linux
          if [ -f "artifacts/linux-build/"*.AppImage ]; then
            cp artifacts/linux-build/*.AppImage release_assets/ppc-bench-${{ github.ref_name }}-linux.AppImage
          fi

          ls -la release_assets/

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          artifacts: "release_assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}
