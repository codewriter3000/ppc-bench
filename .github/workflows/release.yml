name: Release Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: true
          prerelease: false

  build:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        run: npm run build:desktop

      - name: Get build artifacts
        id: artifacts
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            artifact=$(ls apps/desktop/src-tauri/target/release/*.msi 2>/dev/null | head -1)
            artifact_name=$(basename "$artifact")
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            artifact=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
            if [ -z "$artifact" ]; then
              artifact=$(ls apps/desktop/src-tauri/target/release/bundle/macos/*.app 2>/dev/null | head -1)
            fi
            artifact_name=$(basename "$artifact")
          else
            artifact=$(ls apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -1)
            artifact_name=$(basename "$artifact")
          fi

          if [ -z "$artifact" ]; then
            echo "No artifact found for ${{ matrix.platform }}"
            exit 1
          fi

          echo "artifact=$artifact" >> $GITHUB_OUTPUT
          echo "artifact_name=$artifact_name" >> $GITHUB_OUTPUT

      - name: Upload Release Asset (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.artifacts.outputs.artifact }}
          asset_name: ppc-bench-${{ github.ref_name }}-windows.msi
          asset_content_type: application/x-msi

      - name: Upload Release Asset (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.artifacts.outputs.artifact }}
          asset_name: ppc-bench-${{ github.ref_name }}-macos.dmg
          asset_content_type: application/octet-stream

      - name: Upload Release Asset (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.artifacts.outputs.artifact }}
          asset_name: ppc-bench-${{ github.ref_name }}-linux.AppImage
          asset_content_type: application/octet-stream

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Publish Release
        uses: actions/update-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          draft: false
